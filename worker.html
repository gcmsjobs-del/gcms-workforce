<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GCMS Worker Profile</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap"><h1>GCMS Worker Profile</h1><div class="sub">Candidate information for client review</div></div></header><main><div class="detail card" id="profile"></div></main><footer>GCMS • Verify current availability and tickets before mobilisation</footer><script>const workers = [{"slug": "daniel-brown", "name": "Daniel Brown", "role": "Formwork Carpenter", "location": "Perth, WA", "experience": "8 years", "availability": "ASAP", "fifo": "Yes", "status": "Available", "skills": ["RMD", "Structural Concrete", "Walls", "Columns", "Civil"], "tickets": ["White Card", "Working at Heights - Pending"], "projects": ["Civil infrastructure", "Commercial concrete"], "notes": "Very interested in the role; willing to obtain Working at Heights."}, {"slug": "john-smith", "name": "John Smith", "role": "Formwork Carpenter", "location": "Perth, WA", "experience": "12 years", "availability": "ASAP", "fifo": "Yes", "status": "Available", "skills": ["RMD", "Doka", "Peri", "Mining", "Crusher Structures"], "tickets": ["White Card", "Working at Heights", "EWP", "Confined Space"], "projects": ["Mining process plant", "Crusher structures", "Commercial high-rise"], "notes": "Pre-screened for formwork and FIFO."}, {"slug": "mark-wilson", "name": "Mark Wilson", "role": "Scaffolder", "location": "Perth, WA", "experience": "10 years", "availability": "1 Week", "fifo": "Yes", "status": "Available", "skills": ["Industrial Scaffolding", "Mining", "Tube & Fitting"], "tickets": ["Scaffolding Ticket", "White Card", "Working at Heights"], "projects": ["Mining", "Industrial shutdowns"], "notes": "Available for FIFO work."}];const slug=new URLSearchParams(location.search).get('worker');const w=workers.find(x=>x.slug===slug);const el=document.getElementById('profile');if(!w){el.innerHTML='<h2>Worker profile not found</h2><a class="btn back" href="index.html">Back to Workforce</a>'}else{el.innerHTML='<a class="btn back" href="index.html">← Workforce</a><div style="margin-top:18px"><div class="top"><div><div class="name">'+w.name+'</div><div class="role">'+w.role+'</div></div><div class="status">'+w.status+'</div></div><div class="facts section"><div><div class="label">LOCATION</div><div class="value">'+w.location+'</div></div><div><div class="label">EXPERIENCE</div><div class="value">'+w.experience+'</div></div><div><div class="label">AVAILABILITY</div><div class="value">'+w.availability+'</div></div><div><div class="label">FIFO</div><div class="value">'+w.fifo+'</div></div></div><div class="section"><h3>KEY SKILLS</h3><div class="chips">'+w.skills.map(s=>'<span class="chip">'+s+'</span>').join('')+'</div></div><div class="section"><h3>TICKETS / QUALIFICATIONS</h3><div class="chips">'+w.tickets.map(s=>'<span class="chip">'+s+'</span>').join('')+'</div></div><div class="section"><h3>PROJECT EXPERIENCE</h3><p>'+w.projects.join(' • ')+'</p></div><div class="section"><h3>SCREENING NOTES</h3><p>'+w.notes+'</p></div><div class="notice">This profile is for preliminary client review. Confirm ticket currency, availability and mobilisation requirements before engagement.</div></div>'}</script></body></html>
